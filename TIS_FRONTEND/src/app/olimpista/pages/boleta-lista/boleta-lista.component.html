<button (click)="inscribir()" class="w-full bg-blue-600 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded-md">
  Inscribir
</button>
<div *ngIf="boletaPago">
  <h3>Boleta de Pago</h3>
  <p><strong>Número:</strong> {{ boletaPago.numero_boleta }}</p>
  <p><strong>Monto Total:</strong> {{ boletaPago.monto }}</p>
  <p><strong>Fecha de Generación:</strong> {{ boletaPago.fecha_generacion }}</p>
</div>
