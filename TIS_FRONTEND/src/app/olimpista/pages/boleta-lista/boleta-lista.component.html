<div class="container mx-auto p-6 font-roboto">
    <!-- Encabezado con identidad UMSS -->
    <div class="flex items-center mb-6 border-b-2 border-[#1A237E] pb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-[#1A237E] mr-3" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <div>
            <h1 class="text-3xl font-bold text-[#1A237E] font-roboto">Estudiantes Registrados</h1>
        </div>
    </div>

    <!-- Tabla con colores institucionales -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden border border-[#E0E0E0]">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-[#E0E0E0] font-roboto">
                <thead class="bg-[#1A237E]">
                    <tr>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            #</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            Estudiante</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            Curso</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            Área 1</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            Categoría 1</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            Área 2</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider font-roboto">
                            Categoría 2</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-[#E0E0E0]">
                    <tr *ngFor="let student of students; let i = index" class="hover:bg-[#F5F5F5] transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-[#424242] font-roboto">{{ i + 1
                            }}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div
                                    class="flex-shrink-0 h-10 w-10 bg-[#E8EAF6] rounded-full flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#1A237E]" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                    </svg>
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-[#1A237E] font-roboto">{{ student.name }}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[#424242] font-roboto">{{ student.course }}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span
                                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-[#E3F2FD] text-[#0D47A1] font-roboto">
                                {{ student.area1 }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span
                                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-[#F3E5F5] text-[#6A1B9A] font-roboto">
                                {{ student.category1 }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span
                                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-[#E8F5E9] text-[#2E7D32] font-roboto">
                                {{ student.area2 }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span
                                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-[#FFF8E1] text-[#F57F17] font-roboto">
                                {{ student.category2 }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <button (click)="inscribir()"
        class="w-full bg-blue-600 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded-md">
        Inscribir
    </button>
</div>
