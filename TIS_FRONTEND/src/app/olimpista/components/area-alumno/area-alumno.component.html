<div class="flex flex-col p-4 border border-gray-300 rounded-lg shadow-md bg-white w-full h-[350]">
  <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">INSCRIPCIÓN</h3>
  <!-- Dropdown de Estudiantes -->
  <div class="relative mb-4">
    <button (click)="toggleStudentDropdown()"
      class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
      <!-- Muestra el estudiante seleccionado o el texto por defecto -->
      <span>
        {{ estudianteActual ? (estudianteActual.nombre + ' ' + estudianteActual.apellido) : 'Seleccionar estudiante' }}
      </span>
      <svg class="ml-2 h-5 w-5 text-gray-500" [class.rotate-180]="isStudentDropdownOpen"
        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd" />
      </svg>
    </button>

    <!-- Lista de estudiantes -->
    <div *ngIf="isStudentDropdownOpen"
      class="absolute z-20 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none">
      <div class="divide-y divide-gray-100">
        <div *ngFor="let estudiante of estudiantes" class="flex items-center px-4 py-2 hover:bg-blue-50 cursor-pointer">

          <!-- Radio button para selección única -->
          <input type="radio" [id]="'estudiante-' + estudiante.id" [value]="estudiante" [(ngModel)]="estudianteActual"
            (click)="confirmarSeleccion()" name="estudianteSelection"
            class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500 mr-3">

          <!-- Info del estudiante -->
          <label [for]="'estudiante-' + estudiante.id" class="flex-grow cursor-pointer">
            <p class="text-sm text-gray-800 font-medium">
              {{ estudiante.nombre }} {{ estudiante.apellido }}
            </p>
          </label>
        </div>
      </div>
    </div>
  </div>
  <!-- Dropdown de Cursos -->
  <div class="relative mb-4">
    <button (click)="toggleCursoDropdown()"
      class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
      <span>Seleccionar curso</span>
      <svg class="ml-2 h-5 w-5 text-gray-500" [class.transform]="isCursoDropdownOpen"
        [class.rotate-180]="isCursoDropdownOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
        fill="currentColor">
        <path fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd" />
      </svg>
    </button>

    <div *ngIf="isCursoDropdownOpen"
      class="absolute z-20 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none">
      <div class="divide-y divide-gray-100">
        <div *ngFor="let curso of cursos" class="px-4 py-2 hover:bg-blue-50 cursor-pointer">
          <p class="font-medium text-gray-800">{{ curso.nameCurso }}</p>
        </div>
      </div>
    </div>
  </div>
  <!-- Área para inscribirse -->
  <div class="flex flex-col gap-2">
    <div class="grid grid-cols-2 gap-1">
      <div>
        <h4 class="text-md font-semibold text-gray-700 mb-3 border-b pb-2">ÁREA PARA INSCRIBIRSE</h4>

        <div class="relative mb-4">
          <button (click)="toggleAreaDropdown()"
            class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
            <span>{{ seleccionArea1 }}</span>
          </button>

          <div *ngIf="isAreaDropdownOpen"
            class="absolute z-20 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none">
            <div *ngFor="let area of areasDisponibles" class="px-4 py-2 hover:bg-blue-50 cursor-pointer"
              (click)="selectArea1(area.nombre_area)">
              <p class="font-medium text-gray-800">{{area.nombre_area}}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Sección de Categorías -->
      <div>
        <h4 class="text-md font-semibold text-gray-700 mb-3 border-b pb-2">CATEGORÍAS</h4>
        <div class="relative mb-4">
          <button (click)="toggleCategoriaDropdown()"
            class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
            <span>{{ seleccionCategoria || "Selecciona una categoría" }}</span>
          </button>

          <div *ngIf="isCategoriaDropdownOpen"
            class="absolute z-20 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none">
            <div *ngFor="let categoria of categorias" class="px-4 py-2 hover:bg-blue-50 cursor-pointer"
              (click)="selectCategoria(categoria.nombre_nivel)">
              <p class="font-medium text-gray-800">{{ categoria.nombre_nivel }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="flex flex-row gap-1 justify-end items-center pb-2">
      <button (click)="toggleDuplicado()" *ngIf="!isDuplicated"
        class="px-3 py-1 bg-sky-950 text-white font-medium rounded-md hover:bg-sky-800">
        <i class="bi bi-plus-lg text-white text-lg"></i>
        Añadir otra área
      </button>
    </div>
    <!-- Sección duplicada (solo se muestra una vez) -->
    <div *ngIf="isDuplicated" class="grid grid-cols-2 gap-1">
      <div>
        <h4 class="text-md font-semibold text-gray-700 mb-2 border-b pb-1">ÁREA ADICIONAL</h4>

        <div class="relative mb-4">
          <button (click)="toggleAreaDropdown2()"
            class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
            <span>{{ seleccionArea2 }}</span>
          </button>

          <div *ngIf="isAreaDropdownOpen2"
            class="absolute z-20 bottom-full mb-2 w-ful bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none">
            <div *ngFor="let area of areasDisponibles" class="px-4 py-2 hover:bg-blue-50 cursor-pointer"
              (click)="selectArea2(area.nombre_area)">
              <p class="font-medium text-gray-800">{{area.nombre_area}}</p>
            </div>
          </div>
        </div>
      </div>
      <!-- Sección de Categorías -->
      <div>
        <h4 class="text-md font-semibold text-gray-700 mb-2 border-b pb-1">CATEGORÍAS ADICIONALES</h4>
        <div class="relative mb-4">
          <button (click)="toggleCategoriaDropdown2()"
            class="w-full flex justify-between items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
            <span>{{ seleccionCategoria2 || "Selecciona una categoría" }}</span>
          </button>

          <div *ngIf="isCategoriaDropdownOpen2"
            class="absolute z-20 bottom-full mb-2 w-ful bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none">
            <div *ngFor="let categoria of categorias2" class="px-4 py-2 hover:bg-blue-50 cursor-pointer"
              (click)="selectCategoria2(categoria.nombre_nivel)">
              <p class="font-medium text-gray-800">{{ categoria.nombre_nivel }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="isDuplicated" class="flex flex-row gap-1 justify-end items-center pb-2">
      <button (click)="toggleDuplicado()"
        class="px-3 py-1 bg-sky-950 text-white font-medium rounded-md hover:bg-sky-800">
        <i class="bi bi-dash-circle text-lg text-white"></i>
        Eliminar área adicional
      </button>
    </div>
  </div>
  <!-- Botón de inscripción -->
  <button class="w-full bg-[#0D1271] hover:bg-blue-900 text-white font-bold py-2 px-4 rounded-md transition-colors">
    Inscribir Estudiante
  </button>
</div>
