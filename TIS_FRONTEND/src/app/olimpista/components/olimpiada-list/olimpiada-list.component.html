<section class="pt-8 pb-8">
  <div class="container px-4 mx-auto">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (olimpiada of olimpiada; track olimpiada.id) {
      <app-olimpiada-card [olimpiada]="olimpiada" (olimpiadaEliminada)="onOlimpiadaEliminada($event)"
        (olimpiadaActualizada)="onOlimpiadaActualizada($event)"></app-olimpiada-card>
      } @empty {
      <div class="col-span-full text-center py-10">
        <p class="text-gray-500 text-lg">No se encontraron resultados</p>
      </div>
      }
    </div>
  </div>
</section>
