<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<div class="relative min-h-screen w-full overflow-hidden">
  <!-- Formulario de login -->
  <section class="relative flex items-center justify-center min-h-screen px-4 py-12">
    <div class="relative rounded-2xl bg-white p-8 shadow-2xl w-full max-w-md border-t-4 border-purple-600 
                hover:shadow-3xl hover:border-purple-800 transition-all duration-300 ease-in-out">
      
      <!-- Icono superior (similar a las cards) -->
      <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 w-12 h-12 flex items-center justify-center 
                  rounded-full bg-gradient-to-r from-purple-600 to-red-600 text-white shadow-lg">
        <i class="fas fa-user-lock text-xl"></i>
      </div>

      <!-- Contenido del formulario -->
      <div class="text-center mb-8 mt-6">
        <h1 class="text-3xl font-bold text-gray-800">Acceso al Sistema</h1>
        <p class="text-gray-600 mt-2">Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" 
           class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-lg flex items-start">
        <i class="fas fa-exclamation-circle mt-1 mr-3 text-red-500"></i>
        <div>{{ errorMessage }}</div>
      </div>

      <!-- Formulario -->
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Campo Email -->
        <div>
          <label class="block text-gray-700 font-medium mb-2">
            <i class="fas fa-envelope mr-2 text-purple-600"></i>
            Correo Electrónico
          </label>
          <div class="relative">
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              placeholder="tucorreo@ejemplo.com"
              class="w-full p-4 pl-12 border border-gray-300 rounded-xl focus:outline-none 
                     focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
              required
            >
            <i class="fas fa-at absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label class="block text-gray-700 font-medium mb-2">
            <i class="fas fa-lock mr-2 text-purple-600"></i>
            Contraseña
          </label>
          <div class="relative">
            <input
              [(ngModel)]="password"
              name="password"
              type="password"
              placeholder="••••••••"
              class="w-full p-4 pl-12 border border-gray-300 rounded-xl focus:outline-none 
                     focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
              required
            >
            <i class="fas fa-key absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          </div>
        </div>

        <!-- Botón de Iniciar Sesión -->
        <button
          type="submit"
          class="w-full py-4 px-6 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold 
                 rounded-xl hover:from-purple-700 hover:to-blue-700 transition-all duration-300 shadow-lg
                 hover:shadow-xl flex justify-center items-center gap-2"
          [disabled]="isLoading"
        >
          <ng-container *ngIf="isLoading; else notLoading">
            <svg class="animate-spin h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Validando...</span>
          </ng-container>
          <ng-template #notLoading>
            <i class="fas fa-sign-in-alt"></i>
            <span>Iniciar Sesión</span>
          </ng-template>
        </button>

        <!-- Botón de Cancelar -->
        <button
          type="button"
          (click)="onCancel()"
          class="w-full py-3 px-6 bg-white text-gray-700 font-medium border border-gray-300
                 rounded-xl hover:bg-gray-100 transition-all duration-200 mt-4 shadow"
        >
          <i class="fas fa-times mr-2"></i>
          Cancelar
        </button>
      </form>
    </div>
  </section>
</div>
